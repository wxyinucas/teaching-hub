<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">整数重新绑定：名字换了指向，旧整数不变</title>
  <desc id="desc">初始 seed 和 old_seed 都指向整数 42。执行 seed 等于 2026 后，seed 解除原指向，改为指向整数 2026。old_seed 的指向没有改变，仍指向整数 42。图中的灰色虚线只表示已解除的原指向。</desc>
  <defs>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5e33bf"/>
    </marker>
    <marker id="ink-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#191919"/>
    </marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777777"/>
    </marker>
    <style>
      text { fill: #191919; font-family: "Kaiti SC", STKaiti, KaiTi, serif; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .edge { fill: none; stroke-width: 4; stroke-linejoin: round; }
      .name { fill: #f1ecfa; stroke: #291344; stroke-width: 2.5; }
      .purple { fill: #291344; }
      .old { fill: #777777; }
    </style>
  </defs>

  <text class="code" x="20" y="32" font-size="30">seed = 42; old_seed = seed</text>
  <text class="code purple" x="20" y="75" font-size="34">seed = 2026</text>

  <rect class="name" x="20" y="110" width="245" height="60" rx="7"/>
  <text class="code" x="142.5" y="152" text-anchor="middle" font-size="36">old_seed</text>
  <rect class="name" x="20" y="300" width="245" height="60" rx="7"/>
  <text class="code" x="142.5" y="342" text-anchor="middle" font-size="38">seed</text>

  <!-- 上方保留旧对象，下方展示新指向；只有 seed 的指向改变。 -->
  <path class="edge" d="M265 140 H800" stroke="#191919" marker-end="url(#ink-arrow)"/>
  <text x="530" y="125" text-anchor="middle" font-size="31">指向不变</text>
  <path class="edge" d="M265 310 H370 V210 H735 V155 H800" stroke="#777777" stroke-dasharray="9 8" marker-end="url(#gray-arrow)"/>
  <text class="old" x="550" y="251" text-anchor="middle" font-size="30">原指向</text>
  <text class="old" x="550" y="285" text-anchor="middle" font-size="30">已解除</text>
  <path class="edge" d="M265 330 H800" stroke="#5e33bf" marker-end="url(#purple-arrow)"/>
  <text class="purple" x="530" y="365" text-anchor="middle" font-size="31">新指向</text>

  <rect x="800" y="105" width="174" height="70" rx="7" fill="#ffffff" stroke="#191919" stroke-width="2.5"/>
  <text class="code" x="887" y="153" text-anchor="middle" font-size="42">42</text>
  <rect x="800" y="295" width="174" height="70" rx="7" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="code purple" x="887" y="343" text-anchor="middle" font-size="42">2026</text>

  <text x="500" y="425" text-anchor="middle" font-size="31">seed 换了指向，旧整数 42 没有改变</text>
</svg>

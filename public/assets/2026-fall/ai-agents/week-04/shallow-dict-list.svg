<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">浅复制字典：两个字典仍共享列表</title>
  <desc id="desc">variant 是 source 的浅复制，两个名字指向不同字典，但各自的 sample_sizes 字段仍指向同一个列表。把 variant 的 sample_sizes 索引 2 改为 500000，两份配置都会看到列表第三项的修改。旧整数 100000 在上方未变，新整数 500000 在下方。</desc>
  <defs>
    <marker id="ink-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#191919"/></marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#5e33bf"/></marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#777777"/></marker>
    <style>
      text { fill:#191919; font-family:"Kaiti SC",STKaiti,KaiTi,serif; }
      .code { font-family:ui-monospace,Menlo,Consolas,monospace; }
      .edge { fill:none; stroke-width:4; stroke-linejoin:round; }
      .name { fill:#f1ecfa; stroke:#291344; stroke-width:2.5; }
      .purple { fill:#291344; }
      .old { fill:#777777; }
    </style>
  </defs>
  <text class="code" x="20" y="31" font-size="28">variant = source.copy()</text>
  <text class="code purple" x="20" y="77" font-size="32">variant["sample_sizes"][2] = 500000</text>

  <rect class="name" x="10" y="150" width="165" height="60" rx="7"/>
  <text class="code" x="92" y="191" font-size="31" text-anchor="middle">source</text>
  <rect class="name" x="10" y="295" width="165" height="60" rx="7"/>
  <text class="code" x="92" y="336" font-size="31" text-anchor="middle">variant</text>
  <path class="edge" d="M175 180 H220" stroke="#191919" marker-end="url(#ink-arrow)"/>
  <path class="edge" d="M175 325 H220" stroke="#191919" marker-end="url(#ink-arrow)"/>

  <rect x="220" y="125" width="250" height="115" rx="9" fill="#ffffff" stroke="#291344" stroke-width="3"/>
  <text class="purple" x="345" y="159" font-size="30" text-anchor="middle">字典 A</text>
  <rect x="230" y="176" width="230" height="50" rx="6" fill="#ffffff" stroke="#291344" stroke-width="2.5"/>
  <text class="code" x="345" y="210" font-size="27" text-anchor="middle">sample_sizes</text>
  <rect x="220" y="270" width="250" height="115" rx="9" fill="#ffffff" stroke="#291344" stroke-width="3"/>
  <text class="purple" x="345" y="304" font-size="30" text-anchor="middle">字典 B</text>
  <rect x="230" y="321" width="230" height="50" rx="6" fill="#ffffff" stroke="#291344" stroke-width="2.5"/>
  <text class="code" x="345" y="355" font-size="27" text-anchor="middle">sample_sizes</text>
  <text x="345" y="260" font-size="23" text-anchor="middle">仅展开该字段</text>
  <path class="edge" d="M460 201 H500 V207 H535" stroke="#191919" marker-end="url(#ink-arrow)"/>
  <path class="edge" d="M460 346 H500 V232 H535" stroke="#191919" marker-end="url(#ink-arrow)"/>

  <rect x="535" y="155" width="235" height="215" rx="9" fill="#ffffff" stroke="#291344" stroke-width="3"/>
  <text class="purple" x="652" y="196" font-size="31" text-anchor="middle">同一个列表</text>
  <text x="652" y="232" font-size="23" text-anchor="middle">索引 0、1 省略</text>
  <rect x="555" y="255" width="195" height="85" rx="6" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="purple" x="652" y="288" font-size="28" text-anchor="middle">索引 2</text>
  <text class="purple" x="652" y="322" font-size="28" text-anchor="middle">（第 3 项）</text>

  <path class="edge" d="M750 280 H790 V160 H830" stroke="#777777" stroke-dasharray="9 8" marker-end="url(#gray-arrow)"/>
  <text class="old" x="898" y="240" font-size="27" text-anchor="middle">原指向</text>
  <text class="old" x="898" y="272" font-size="27" text-anchor="middle">已解除</text>
  <path class="edge" d="M750 315 H800 V365 H830" stroke="#5e33bf" marker-end="url(#purple-arrow)"/>
  <rect x="830" y="125" width="155" height="70" rx="7" fill="#ffffff" stroke="#191919" stroke-width="2.5"/>
  <text class="code" x="907" y="172" font-size="33" text-anchor="middle">100000</text>
  <rect x="830" y="330" width="155" height="70" rx="7" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="code purple" x="907" y="377" font-size="33" text-anchor="middle">500000</text>
  <text x="500" y="429" font-size="29" text-anchor="middle">字典 A、B 仍共享列表，第三项修改同时可见</text>
</svg>

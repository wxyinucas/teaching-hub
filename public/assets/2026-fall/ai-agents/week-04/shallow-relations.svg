<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">浅复制：两个字典仍然引用同一列表</title>
  <desc id="desc">先执行 variant 等于 source 的浅复制。source 和 variant 指向两个不同字典，但两个字典的 sample_sizes 字段仍指向同一个列表。字典身份比较为 False，列表身份比较为 True。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#191919"/></marker>
    <style>
      text { fill:#191919; font-family:"Kaiti SC",STKaiti,KaiTi,serif; }
      .code { font-family:ui-monospace,Menlo,Consolas,monospace; }
      .name { fill:#f1ecfa; stroke:#291344; stroke-width:2.5; }
      .box { fill:white; stroke:#291344; stroke-width:2.5; }
      .edge { fill:none; stroke:#191919; stroke-width:4; stroke-linejoin:round; marker-end:url(#arrow); }
      .purple { fill:#291344; }
    </style>
  </defs>
  <text class="code" x="20" y="32" font-size="31">variant = source.copy()</text>
  <text class="code purple" x="20" y="75" font-size="27">source["sample_sizes"] is variant["sample_sizes"]  # True</text>

  <rect class="name" x="20" y="141" width="185" height="60" rx="7"/>
  <text class="code" x="112.5" y="183" text-anchor="middle" font-size="34">source</text>
  <rect class="name" x="20" y="291" width="185" height="60" rx="7"/>
  <text class="code" x="112.5" y="333" text-anchor="middle" font-size="34">variant</text>
  <path class="edge" d="M205 171 H275"/>
  <path class="edge" d="M205 321 H275"/>

  <rect class="box" x="275" y="125" width="310" height="100" rx="7"/>
  <text x="430" y="158" text-anchor="middle" font-size="31">字典 A</text>
  <text class="code" x="430" y="203" text-anchor="middle" font-size="31">sample_sizes</text>
  <rect class="box" x="275" y="275" width="310" height="100" rx="7"/>
  <text x="430" y="308" text-anchor="middle" font-size="31">字典 B</text>
  <text class="code" x="430" y="353" text-anchor="middle" font-size="31">sample_sizes</text>
  <path class="edge" d="M585 195 H650 V230 H710"/>
  <path class="edge" d="M585 345 H650 V290 H710"/>

  <rect x="710" y="190" width="265" height="145" rx="7" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="purple" x="842.5" y="233" text-anchor="middle" font-size="34">同一个列表</text>
  <text x="842.5" y="274" text-anchor="middle" font-size="27">第 3 项：500000</text>
  <text x="842.5" y="313" text-anchor="middle" font-size="26">其余项省略</text>

  <text x="500" y="426" text-anchor="middle" font-size="31">外层字典不同，内层列表仍然共享</text>
</svg>

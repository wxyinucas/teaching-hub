<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">共享字典与列表：替换第三项</title>
  <desc id="desc">source 和 variant 指向同一字典，其 sample_sizes 字段指向同一列表。把 variant 的 sample_sizes 索引 2 改为 500000，替换了列表第三项的指向。旧整数 100000 在上方，新整数 500000 在下方，两个名字都能看到修改。</desc>
  <defs>
    <marker id="ink-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#191919"/></marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#5e33bf"/></marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#777777"/></marker>
    <style>
      text { fill:#191919; font-family:"Kaiti SC",STKaiti,KaiTi,serif; }
      .code { font-family:ui-monospace,Menlo,Consolas,monospace; }
      .edge { fill:none; stroke-width:4; stroke-linejoin:round; }
      .name { fill:#f1ecfa; stroke:#291344; stroke-width:2.5; }
      .purple { fill:#291344; }
      .old { fill:#777777; }
    </style>
  </defs>
  <text class="code" x="20" y="31" font-size="28">variant = source</text>
  <text class="code purple" x="20" y="77" font-size="32">variant["sample_sizes"][2] = 500000</text>

  <rect class="name" x="10" y="140" width="175" height="60" rx="7"/>
  <text class="code" x="97" y="181" font-size="31" text-anchor="middle">source</text>
  <rect class="name" x="10" y="260" width="175" height="60" rx="7"/>
  <text class="code" x="97" y="301" font-size="31" text-anchor="middle">variant</text>
  <path class="edge" d="M185 170 H225" stroke="#191919" marker-end="url(#ink-arrow)"/>
  <path class="edge" d="M185 290 H205 V190 H225" stroke="#191919" marker-end="url(#ink-arrow)"/>

  <rect x="225" y="130" width="280" height="220" rx="9" fill="#ffffff" stroke="#291344" stroke-width="3"/>
  <text class="purple" x="365" y="174" font-size="32" text-anchor="middle">同一个字典</text>
  <rect x="240" y="210" width="245" height="75" rx="6" fill="#ffffff" stroke="#291344" stroke-width="2.5"/>
  <text class="code" x="362" y="258" font-size="28" text-anchor="middle">sample_sizes</text>
  <text x="365" y="326" font-size="25" text-anchor="middle">仅展开该字段</text>
  <path class="edge" d="M485 247 H525 V205 H550" stroke="#191919" marker-end="url(#ink-arrow)"/>

  <rect x="550" y="155" width="230" height="210" rx="9" fill="#ffffff" stroke="#291344" stroke-width="3"/>
  <text class="purple" x="665" y="197" font-size="31" text-anchor="middle">同一个列表</text>
  <text x="665" y="232" font-size="23" text-anchor="middle">索引 0、1 省略</text>
  <rect x="570" y="253" width="190" height="85" rx="6" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="purple" x="665" y="287" font-size="28" text-anchor="middle">索引 2</text>
  <text class="purple" x="665" y="320" font-size="28" text-anchor="middle">（第 3 项）</text>

  <path class="edge" d="M760 277 H800 V162 H830" stroke="#777777" stroke-dasharray="9 8" marker-end="url(#gray-arrow)"/>
  <text class="old" x="898" y="240" font-size="27" text-anchor="middle">原指向</text>
  <text class="old" x="898" y="272" font-size="27" text-anchor="middle">已解除</text>
  <path class="edge" d="M760 310 H800 V365 H830" stroke="#5e33bf" marker-end="url(#purple-arrow)"/>
  <rect x="830" y="127" width="155" height="70" rx="7" fill="#ffffff" stroke="#191919" stroke-width="2.5"/>
  <text class="code" x="907" y="173" font-size="33" text-anchor="middle">100000</text>
  <rect x="830" y="330" width="155" height="70" rx="7" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="code purple" x="907" y="376" font-size="33" text-anchor="middle">500000</text>
  <text x="500" y="429" font-size="29" text-anchor="middle">两个名字通向同一列表，第三项修改同时可见</text>
</svg>

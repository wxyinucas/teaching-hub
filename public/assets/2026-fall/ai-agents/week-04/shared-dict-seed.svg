<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">共享字典：替换 seed 字段</title>
  <desc id="desc">variant 等于 source 后，两个名字指向同一个字典。把 variant 的 seed 改为 2026，替换了这个共享字典的 seed 指向。旧整数 42 在上方，未被修改，新整数 2026 在下方。source 同样读到 2026。</desc>
  <defs>
    <marker id="ink-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#191919"/></marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#5e33bf"/></marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#777777"/></marker>
    <style>
      text { fill:#191919; font-family:"Kaiti SC",STKaiti,KaiTi,serif; }
      .code { font-family:ui-monospace,Menlo,Consolas,monospace; }
      .edge { fill:none; stroke-width:4; stroke-linejoin:round; }
      .name { fill:#f1ecfa; stroke:#291344; stroke-width:2.5; }
      .purple { fill:#291344; }
      .old { fill:#777777; }
    </style>
  </defs>
  <text class="code" x="20" y="31" font-size="28">variant = source</text>
  <text class="code purple" x="20" y="77" font-size="32">variant["seed"] = 2026</text>

  <rect class="name" x="20" y="150" width="180" height="60" rx="7"/>
  <text class="code" x="110" y="191" font-size="32" text-anchor="middle">source</text>
  <rect class="name" x="20" y="275" width="180" height="60" rx="7"/>
  <text class="code" x="110" y="316" font-size="32" text-anchor="middle">variant</text>
  <path class="edge" d="M200 180 H300" stroke="#191919" marker-end="url(#ink-arrow)"/>
  <path class="edge" d="M200 305 H250 V200 H300" stroke="#191919" marker-end="url(#ink-arrow)"/>

  <rect x="300" y="145" width="265" height="215" rx="9" fill="#ffffff" stroke="#291344" stroke-width="3"/>
  <text class="purple" x="432" y="190" font-size="34" text-anchor="middle">同一个字典</text>
  <rect x="320" y="220" width="225" height="80" rx="6" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="code purple" x="432" y="271" font-size="35" text-anchor="middle">seed</text>
  <text x="432" y="338" font-size="25" text-anchor="middle">仅展开该字段</text>

  <path class="edge" d="M545 245 H675 V172 H820" stroke="#777777" stroke-dasharray="9 8" marker-end="url(#gray-arrow)"/>
  <text class="old" x="724" y="243" font-size="28" text-anchor="middle">原指向</text>
  <text class="old" x="724" y="277" font-size="28" text-anchor="middle">已解除</text>
  <path class="edge" d="M545 275 H625 V332 H820" stroke="#5e33bf" marker-end="url(#purple-arrow)"/>
  <text class="purple" x="721" y="371" font-size="28" text-anchor="middle">新指向</text>

  <rect x="820" y="137" width="154" height="70" rx="7" fill="#ffffff" stroke="#191919" stroke-width="2.5"/>
  <text class="code" x="897" y="185" font-size="42" text-anchor="middle">42</text>
  <rect x="820" y="297" width="154" height="70" rx="7" fill="#f1ecfa" stroke="#5e33bf" stroke-width="3"/>
  <text class="code purple" x="897" y="345" font-size="40" text-anchor="middle">2026</text>
  <text x="500" y="426" font-size="29" text-anchor="middle">共享字典的 seed 被替换，source 也读到 2026</text>
</svg>

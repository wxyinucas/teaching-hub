<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">买入50股、限价100，只成交卖一的30股</title>
  <desc id="desc">合成静态单场所卖盘：价格100元数量30股、100.10元40股、100.20元100股。一张买入50股、限价100元的委托，只能匹配第一档30股；剩余20股是买方未成交数量，仍在等待，不是新增卖盘。已成交部分不会因撤单消失。</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#5e33bf"/></marker>
    <style>
      text { fill:#191919; font-family:Baskerville,"Kaiti SC",STKaiti,KaiTi,serif; font-weight:600; }
      .rule { stroke:#d9cbed; stroke-width:2; }
      .purple { fill:#291344; }
    </style>
  </defs>
  <text x="320" y="48" text-anchor="middle" font-size="46">原始卖盘</text>
  <text x="200" y="105" text-anchor="middle" font-size="36">价格 / 元</text>
  <text x="485" y="105" text-anchor="middle" font-size="36">数量 / 股</text>
  <rect x="40" y="126" width="580" height="76" fill="#f1ecfa"/>
  <path class="rule" d="M40 121 H620 M40 208 H620 M40 310 H620 M40 412 H620"/>
  <text class="purple" x="200" y="181" text-anchor="middle" font-size="52">100.00</text>
  <text class="purple" x="485" y="181" text-anchor="middle" font-size="52">30</text>
  <text x="200" y="281" text-anchor="middle" font-size="50">100.10</text>
  <text x="485" y="281" text-anchor="middle" font-size="50">40</text>
  <text x="200" y="383" text-anchor="middle" font-size="50">100.20</text>
  <text x="485" y="383" text-anchor="middle" font-size="50">100</text>
  <text x="1070" y="88" text-anchor="middle" font-size="50">买入 50 股</text>
  <text class="purple" x="1070" y="151" text-anchor="middle" font-size="46">限价 100.00 元</text>
  <path d="M620 164 H700 V268 H805" fill="none" stroke="#5e33bf" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="purple" x="1070" y="285" text-anchor="middle" font-size="54">已成交：30 股</text>
  <text x="1070" y="365" text-anchor="middle" font-size="54">仍等待：20 股</text>
  <text x="1070" y="422" text-anchor="middle" font-size="34">剩余部分可申请撤单</text>
  <text x="720" y="499" text-anchor="middle" font-size="34">静态单场所合成示例 · 已成交部分不会因撤单消失</text>
</svg>

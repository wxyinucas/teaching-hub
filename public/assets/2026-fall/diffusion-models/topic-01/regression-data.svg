<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400.000" viewBox="0 0 1040 520" role="img" aria-labelledby="title description">
<title id="title">输入、观测目标与候选预测</title>
<desc id="description">五个教学散点来自 y=绝对值x。橙色水平线是尚未拟合的候选预测1；x等于0时预测减目标为1。</desc>
<rect width="1040" height="520" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#756f7b"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#343039">
<text x="45" y="48" font-size="28" fill="#343039" text-anchor="start" font-weight="600">同一批数据：观测目标与候选预测</text>
<line x1="100" y1="270" x2="865" y2="270" stroke="#e6e0eb" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="75" y="278" font-size="22" fill="#343039" text-anchor="end" font-weight="normal">1</text>
<line x1="100" y1="150" x2="865" y2="150" stroke="#e6e0eb" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="75" y="158" font-size="22" fill="#343039" text-anchor="end" font-weight="normal">2</text>
<line x1="100" y1="390" x2="890" y2="390" stroke="#756f7b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="480" y1="415" x2="480" y2="92" stroke="#756f7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="905" y="398" font-size="24" fill="#343039" text-anchor="start" font-weight="normal">x</text>
<text x="492" y="96" font-size="24" fill="#343039" text-anchor="start" font-weight="normal">y</text>
<line x1="160" y1="390" x2="160" y2="397" stroke="#756f7b" stroke-width="2"/>
<text x="160" y="429" font-size="22" fill="#343039" text-anchor="middle" font-weight="normal">−2</text>
<line x1="320" y1="390" x2="320" y2="397" stroke="#756f7b" stroke-width="2"/>
<text x="320" y="429" font-size="22" fill="#343039" text-anchor="middle" font-weight="normal">−1</text>
<line x1="480" y1="390" x2="480" y2="397" stroke="#756f7b" stroke-width="2"/>
<text x="480" y="429" font-size="22" fill="#343039" text-anchor="middle" font-weight="normal">0</text>
<line x1="640" y1="390" x2="640" y2="397" stroke="#756f7b" stroke-width="2"/>
<text x="640" y="429" font-size="22" fill="#343039" text-anchor="middle" font-weight="normal">1</text>
<line x1="800" y1="390" x2="800" y2="397" stroke="#756f7b" stroke-width="2"/>
<text x="800" y="429" font-size="22" fill="#343039" text-anchor="middle" font-weight="normal">2</text>
<line x1="120" y1="270" x2="855" y2="270" stroke="#a66319" stroke-width="3.5" stroke-dasharray="10 6"/>
<text x="650" y="250" font-size="24" fill="#a66319" text-anchor="start" font-weight="normal">候选预测 ŷ = 1</text>
<circle cx="160" cy="150" r="7" fill="#6c3fa0" stroke="#fff" stroke-width="2"/>
<circle cx="320" cy="270" r="7" fill="#6c3fa0" stroke="#fff" stroke-width="2"/>
<circle cx="480" cy="390" r="7" fill="#6c3fa0" stroke="#fff" stroke-width="2"/>
<circle cx="640" cy="270" r="7" fill="#6c3fa0" stroke="#fff" stroke-width="2"/>
<circle cx="800" cy="150" r="7" fill="#6c3fa0" stroke="#fff" stroke-width="2"/>
<line x1="505" y1="390" x2="505" y2="270" stroke="#a66319" stroke-width="3"/>
<line x1="499" y1="390" x2="511" y2="390" stroke="#a66319" stroke-width="3"/>
<line x1="499" y1="270" x2="511" y2="270" stroke="#a66319" stroke-width="3"/>
<text x="527" y="338" font-size="24" fill="#a66319" text-anchor="start" font-weight="normal">ŷ − y = 1</text>
<circle cx="480" cy="270" r="7" fill="#fff" stroke="#a66319" stroke-width="3"/>
<text x="45" y="485" font-size="23" fill="#343039" text-anchor="start" font-weight="normal">紫点是给定数据；虚线是当前选择的一条预测曲线，并非最优结果。</text>
</g>
</svg>
